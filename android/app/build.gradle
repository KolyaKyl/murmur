plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace = "app.fone.murmur"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "app.fone.murmur"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk = flutter.minSdkVersion
        minSdkVersion 23  
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Релизный ключ читается из local.properties, которого нет в репозитории.
        // Без guard'а Gradle падал бы на этапе конфигурации даже при debug-сборке.
        release {
            if (localProperties['android.sign.keyfile'] != null) {
                storeFile file(localProperties['android.sign.keyfile'])
                storePassword localProperties['android.sign.storepass']
                keyAlias localProperties['android.sign.keyalias']
                keyPassword localProperties['android.sign.storepass']
            }
        }
        // debug намеренно не переопределяем: AGP подставит стандартный
        // ~/.android/debug.keystore, и отладка собирается без секретов.
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
